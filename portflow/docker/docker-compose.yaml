name: portflow

networks:
  portflow-network:
    driver: bridge

volumes:
  portflow-postgres-data:
  portflow-postgres-legado-data:
  portflow-mongodb-data:
  portflow-kafka-data:
  portflow-neo4j-data:
  portflow-neo4j-logs:
  portflow-neo4j-import:
  portflow-neo4j-plugins:

services:
  postgresql:
    container_name: portflow-pg
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: portflow
      POSTGRES_PASSWORD: portflow
      POSTGRES_DB: portflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portflow -d portflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - portflow-postgres-data:/var/lib/postgresql/data
    networks:
           - portflow-network

  postgres-legado:
    image: postgres:17
    container_name: portflow-postgres-legado
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_DB: portflow_legado
      POSTGRES_USER: portflow
      POSTGRES_PASSWORD: portflow
    ports:
      - "5433:5432"
    volumes:
      - portflow-postgres-legado-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portflow -d portflow_legado"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - portflow-network          

  neo4j:
    image: neo4j:5.26
    container_name: portflow-neo4j
    environment:
      NEO4J_AUTH: neo4j/portflow123

      # Plugins úteis para laboratório
      NEO4J_PLUGINS: '["apoc"]'

      # Libera procedimentos APOC básicos
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*

      # Configurações didáticas para ambiente local
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt Driver
    volumes:
      - portflow-neo4j-data:/data
      - portflow-neo4j-logs:/logs
      - portflow-neo4j-import:/var/lib/neo4j/import
      - portflow-neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - portflow-network

  mongodb:
     container_name: portflow-mongo
     image: mongo:8
     environment:
         MONGO_INITDB_ROOT_USERNAME: portflow
         MONGO_INITDB_ROOT_PASSWORD: portflow
         MONGO_INITDB_DATABASE: terminal_service
     ports:
        - "27017:27017"  
     healthcheck:
        test: ["CMD", "mongosh", "--username","portflow", "--password", "portflow"]
        interval: 5s
        timeout: 5s
        retries: 10     
     volumes:
        - ./mongo/init:/docker-entrypoint-initdb.d
        - portflow-mongodb-data:/data/db
     networks:
           - portflow-network 

  kafka:
      image: apache/kafka:4.1.0
      container_name: portflow-kafka
      ports:
        - "9092:9092"
        - "29092:29092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller

        KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      volumes:
        - portflow-kafka-data:/var/lib/kafka/data
      healthcheck:
        test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
        interval: 10s
        timeout: 10s
        retries: 10
      networks:
           - portflow-network 

  kafka-connect:
      image: debezium/connect:2.7.3.Final
      container_name: portflow-kafka-connect
      ports:
        - "8083:8083"
      environment:
        # Desabilita JMX/RMI para evitar warnings de RMI TCP Accept
        KAFKA_JMX_PORT: ""
        KAFKA_JMX_HOSTNAME: ""
        KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote=false"
        KAFKA_OPTS: "-Dcom.sun.management.jmxremote=false -Dcom.sun.management.jmxremote.local.only=true -Djava.rmi.server.hostname=127.0.0.1 -XX:+DisableAttachMechanism"
        JAVA_TOOL_OPTIONS: "-Dcom.sun.management.jmxremote=false -Dcom.sun.management.jmxremote.local.only=true -Djava.rmi.server.hostname=127.0.0.1 -XX:+DisableAttachMechanism"

        BOOTSTRAP_SERVERS: kafka:29092
        GROUP_ID: portflow-connect-cluster

        CONFIG_STORAGE_TOPIC: portflow_connect_configs
        OFFSET_STORAGE_TOPIC: portflow_connect_offsets
        STATUS_STORAGE_TOPIC: portflow_connect_statuses

        CONFIG_STORAGE_REPLICATION_FACTOR: 1
        OFFSET_STORAGE_REPLICATION_FACTOR: 1
        STATUS_STORAGE_REPLICATION_FACTOR: 1

        KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
        VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

        KEY_CONVERTER_SCHEMAS_ENABLE: "false"
        VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

        REST_ADVERTISED_HOST_NAME: kafka-connect
        REST_PORT: 8083

        # Facilita uso didático com JSON sem schema
        CONNECT_PLUGIN_PATH: /kafka/connect,/debezium-connector-postgres,/debezium-connector-mysql,/debezium-connector-mongodb,/debezium-connector-sqlserver,/debezium-connector-oracle
      depends_on:
        kafka:
          condition: service_healthy
        postgresql:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
        interval: 10s
        timeout: 10s
        retries: 20
      networks:
        - portflow-network

  ksqldb-server:
      image: confluentinc/ksqldb-server:0.29.0
      container_name: portflow-ksqldb-server
      ports:
        - "8088:8088"
      environment:
        # Desabilita JMX/RMI para evitar warnings de RMI TCP Accept
        KSQL_JMX_PORT: ""
        KSQL_JMX_HOSTNAME: ""
        KSQL_JMX_OPTS: "-Dcom.sun.management.jmxremote=false"
        KSQL_OPTS: "-Dcom.sun.management.jmxremote=false -Dcom.sun.management.jmxremote.local.only=true -Djava.rmi.server.hostname=127.0.0.1 -XX:+DisableAttachMechanism"
        JAVA_TOOL_OPTIONS: "-Dcom.sun.management.jmxremote=false -Dcom.sun.management.jmxremote.local.only=true -Djava.rmi.server.hostname=127.0.0.1 -XX:+DisableAttachMechanism"

        KSQL_BOOTSTRAP_SERVERS: kafka:29092
        KSQL_LISTENERS: http://0.0.0.0:8088
        KSQL_KSQL_SERVICE_ID: portflow_ksqldb_service_

        # Tópico interno do ksqlDB
        KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 1
        KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: 1

        # Conversores padrão
        KSQL_KSQL_SCHEMA_REGISTRY_URL: ""
      depends_on:
        kafka:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:8088/info || exit 1"]
        interval: 10s
        timeout: 10s
        retries: 20
      networks:
        - portflow-network

  ksqldb-cli:
      image: confluentinc/ksqldb-cli:0.29.0
      container_name: portflow-ksqldb-cli
      entrypoint: /bin/sh
      tty: true
      environment:
        # Desabilita JMX/RMI para evitar warnings de RMI TCP Accept
        KSQL_JMX_PORT: ""
        KSQL_JMX_HOSTNAME: ""
        KSQL_JMX_OPTS: "-Dcom.sun.management.jmxremote=false"
        KSQL_OPTS: "-Dcom.sun.management.jmxremote=false -Dcom.sun.management.jmxremote.local.only=true -Djava.rmi.server.hostname=127.0.0.1 -XX:+DisableAttachMechanism"
        JAVA_TOOL_OPTIONS: "-Dcom.sun.management.jmxremote=false -Dcom.sun.management.jmxremote.local.only=true -Djava.rmi.server.hostname=127.0.0.1 -XX:+DisableAttachMechanism"
      depends_on:
        ksqldb-server:
          condition: service_healthy
      networks:
        - portflow-network      

  kafka-ui:
      image: provectuslabs/kafka-ui:latest
      container_name: portflow-kafka-ui
      depends_on:
        kafka:
          condition: service_healthy
      ports:
        - "8080:8080"
      environment:
        KAFKA_CLUSTERS_0_NAME: portflow-local
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
        KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: portflow-connect
        KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      networks:
        - portflow-network  

  terminal-service:
        image: terminal-service:latest
        container_name: terminal-service
        build:
          context: ../terminal-service
          dockerfile: docker/Dockerfile
        ports:  
           - "8082:8082" 
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
          interval: 10s
          timeout: 10s
          retries: 4       
        depends_on:
          eureka-server:
            condition: service_healthy
          postgresql:
              condition: service_healthy 
          kafka:
             condition: service_healthy
        networks:
          - portflow-network        

  container-service:
        image: container-service:latest
        container_name: container-service
        build:
          context: ../container-service
          dockerfile: docker/Dockerfile
        ports:
           - "8081:8081"
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
          interval: 10s
          timeout: 10s
          retries: 4   
        depends_on:
          eureka-server:
            condition: service_healthy
          postgresql:
            condition: service_healthy
          kafka:
            condition: service_healthy
        networks:
          - portflow-network      

  eureka-server:
        image: eureka-server:latest
        container_name: eureka
        build:
          context: ../eureka
          dockerfile: docker/Dockerfile
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
          interval: 10s
          timeout: 10s
          retries: 4
        ports:
           - "8761:8761"
        networks:
           - portflow-network       

  api-gateway:
        image: api-gateway:latest
        container_name: api-gateway
        build:
          context: ../api-gateway
          dockerfile: docker/Dockerfile
        ports:
           - "9999:9999"         
        depends_on:
          eureka-server:
            condition: service_healthy  
        networks:
           - portflow-network    

 

